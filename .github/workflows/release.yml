name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Read and validate version
        run: |
          $config = Get-Content app/build.gradle.kts -Raw
          $version = [regex]::Match($config, 'versionName = "([^"]+)"').Groups[1].Value
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-[A-Za-z0-9.]+)?$') { throw 'Invalid versionName' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match versionName' }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Install Android build tools
        run: |
          $manager = Join-Path $env:ANDROID_HOME 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK installation failed' }
          "ANDROID_NDK_HOME=$env:ANDROID_HOME/ndk/29.0.14206865" >> $env:GITHUB_ENV

      - name: Prepare pinned runtime
        run: node scripts/prepare-runtime.mjs .runtime-cache

      - name: Restore persistent alpha signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_ALPHA_KEYSTORE_BASE64 }}
        run: |
          if (!$env:KEYSTORE_BASE64) { throw 'Configure ANDROID_ALPHA_KEYSTORE_BASE64 before building' }
          $directory = Join-Path $env:USERPROFILE '.android'
          New-Item -ItemType Directory -Force $directory | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $directory 'debug.keystore'), [Convert]::FromBase64String($env:KEYSTORE_BASE64))

      - name: Build and check
        run: ./gradlew.bat :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console plain

      - name: Prepare release files
        run: |
          $signer = Join-Path $env:ANDROID_HOME 'build-tools/36.0.0/apksigner.bat'
          $certificate = & $signer verify --print-certs app/build/outputs/apk/debug/app-debug.apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          if (($certificate -join "`n") -notmatch '5591136515bc61d9b1bffbe874db221315f8f1376d8de71f2387aa54c413b2db') { throw 'Unexpected signing certificate; refusing incompatible update' }
          New-Item -ItemType Directory -Force dist | Out-Null
          $name = "Opencode-PE-$env:APP_VERSION-arm64.apk"
          Copy-Item app/build/outputs/apk/debug/app-debug.apk "dist/$name"
          $hash = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
          Copy-Item app/src/main/assets/runtime/sources.json dist/runtime-sources.json
          Copy-Item THIRD_PARTY_NOTICES.md dist/
          Compress-Archive -Path licenses/* -DestinationPath dist/licenses.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Opencode-PE-${{ env.APP_VERSION }}-arm64
          path: dist/*
          compression-level: 0
          retention-days: 14
          if-no-files-found: error

      - name: Publish tagged release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $body = @"
          OpenCode Pocket Edition for Android.

          Download the ARM64 APK below. Requires Android 9+. Termux is optional.
          This build uses the persistent alpha development signing key and can update compatible previous alpha installations.

          Built automatically from tag $tag. Build, JVM tests and Android lint passed; device regression tests are not part of this workflow.
          Checksums, runtime provenance and third-party notices are attached.
          "@
          $body | Set-Content release-notes.md -Encoding utf8NoBOM
          gh release view $tag --json isDraft > release-state.json 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(Get-Content release-state.json -Raw | ConvertFrom-Json).isDraft) { throw 'A published release already exists; use a new version tag' }
          } else {
            $options = @('release', 'create', $tag, '--verify-tag', '--draft', '--title', "Opencode-PE $env:APP_VERSION", '--notes-file', 'release-notes.md')
            if ($env:APP_VERSION.Contains('-')) { $options += '--prerelease' }
            & gh @options
            if ($LASTEXITCODE -ne 0) { throw 'Could not create release draft' }
          }
          $files = @(Get-ChildItem dist -File | ForEach-Object FullName)
          gh release upload $tag @files --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft retained' }
          gh release edit $tag --draft=false
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish release' }

      - name: Remove signing key
        if: always()
        run: |
          $key = Join-Path $env:USERPROFILE '.android/debug.keystore'
          if (Test-Path -LiteralPath $key) { Remove-Item -LiteralPath $key -Force }
